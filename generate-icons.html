<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<canvas id="cm" width="512" height="512"></canvas>
<canvas id="cb" width="72" height="72"></canvas>
<script>
function drawIcon(canvas, size, maskable) {
  const ctx = canvas.getContext('2d');
  const s = size;
  const pad = maskable ? s * 0.1 : 0;
  const r = maskable ? 0 : s * 0.1875;

  // Background
  ctx.fillStyle = '#3b82f6';
  if (r > 0) {
    ctx.beginPath();
    ctx.roundRect(0, 0, s, s, r);
    ctx.fill();
  } else {
    ctx.fillRect(0, 0, s, s);
  }

  const ox = pad + (s - pad*2) * 0.25;
  const oy = pad + (s - pad*2) * 0.75;
  const unit = (s - pad*2) * 0.2;

  ctx.strokeStyle = 'white';
  ctx.fillStyle = 'white';
  ctx.lineCap = 'round';

  // Dot
  ctx.beginPath();
  ctx.arc(ox, oy, unit * 0.5, 0, Math.PI * 2);
  ctx.fill();

  // Arc 1
  ctx.lineWidth = unit * 0.44;
  ctx.beginPath();
  ctx.arc(ox, oy, unit * 1.0, -Math.PI/2, 0);
  ctx.stroke();

  // Arc 2
  ctx.lineWidth = unit * 0.44;
  ctx.beginPath();
  ctx.arc(ox, oy, unit * 2.0, -Math.PI/2, 0);
  ctx.stroke();

  // Arc 3
  ctx.lineWidth = unit * 0.44;
  ctx.beginPath();
  ctx.arc(ox, oy, unit * 3.0, -Math.PI/2, 0);
  ctx.stroke();
}

drawIcon(document.getElementById('c192'), 192, false);
drawIcon(document.getElementById('c512'), 512, false);
drawIcon(document.getElementById('cm'), 512, true);

// Badge (small, just dot on blue)
const bc = document.getElementById('cb');
const bctx = bc.getContext('2d');
bctx.fillStyle = '#3b82f6';
bctx.beginPath();
bctx.roundRect(0, 0, 72, 72, 18);
bctx.fill();
bctx.fillStyle = 'white';
bctx.beginPath();
bctx.arc(36, 36, 20, 0, Math.PI*2);
bctx.fill();

function saveCanvas(id, filename) {
  const a = document.createElement('a');
  a.download = filename;
  a.href = document.getElementById(id).toDataURL('image/png');
  a.click();
}

// Auto-download all icons
setTimeout(() => {
  saveCanvas('c192', 'icon-192.png');
  setTimeout(() => saveCanvas('c512', 'icon-512.png'), 500);
  setTimeout(() => saveCanvas('cm', 'icon-maskable.png'), 1000);
  setTimeout(() => saveCanvas('cb', 'badge-72.png'), 1500);
}, 100);
</script>
<p>Icons werden generiert und heruntergeladen...</p>
</body>
</html>
